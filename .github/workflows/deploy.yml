name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Ejecutar tests
        run: npm test

  deploy:
    name: Deploy a producción (Vercel)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Desplegar a Vercel
        id: deploy
        run: |
          npx --yes vercel@59.5.0 pull --yes --environment=production --token "$VERCEL_TOKEN"
          URL=$(npx --yes vercel@59.5.0 deploy --prod --yes --token "$VERCEL_TOKEN" 2>&1 | grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Desplegado en: $URL"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Resumen
        run: echo "🌻 **Girasoles en producción → ${{ steps.deploy.outputs.url }}**" >> "$GITHUB_STEP_SUMMARY"

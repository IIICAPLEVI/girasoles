<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="theme-color" content="#000000"/>
<title>🌻 Para Chezy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>"/>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
  #c{display:block;width:100vw;height:100vh;touch-action:none}

  /* ── carta de apertura ───────────────────────────── */
  #letter{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
          padding:22px;box-sizing:border-box;
          background:radial-gradient(ellipse at 50% 42%, rgba(64,46,14,.40), rgba(0,0,0,.94) 72%);
          transition:opacity 1.1s ease, visibility 1.1s ease}
  #letter.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .card{position:relative;width:min(92vw,540px);box-sizing:border-box;
        padding:clamp(34px,7vw,54px) clamp(24px,6vw,50px) clamp(30px,6vw,44px);
        text-align:center;border-radius:16px;
        background:linear-gradient(165deg,#181207 0%,#0e0a04 55%,#130d05 100%);
        border:1px solid rgba(255,212,128,.26);
        box-shadow:0 30px 90px rgba(0,0,0,.85), 0 0 120px rgba(255,170,50,.06) inset, 0 0 60px rgba(255,170,50,.05);
        animation:cardIn 1.5s cubic-bezier(.2,.9,.25,1) both}
  @keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.955)}to{opacity:1;transform:none}}
  .seal{position:absolute;top:-27px;left:50%;width:54px;height:54px;border-radius:50%;
        transform:translateX(-50%) rotate(-7deg);
        background:radial-gradient(circle at 34% 28%,#ffe3a0,#d99b2e 58%,#8f5d12 100%);
        box-shadow:0 5px 16px rgba(0,0,0,.6), 0 0 30px rgba(255,190,80,.3);
        display:flex;align-items:center;justify-content:center;
        color:#3a2205;font:700 21px/1 Georgia,'Times New Roman',serif}
  .eyebrow{margin:12px 0 16px;color:rgba(255,220,150,.58);
           font:600 11px/1 Georgia,serif;letter-spacing:.34em;text-transform:uppercase}
  .card h1{margin:0 0 16px;color:#ffe9b0;
           font:italic 600 clamp(27px,5.6vw,40px)/1.28 Georgia,'Times New Roman',serif;
           text-shadow:0 0 30px rgba(255,190,70,.38)}
  .card p{margin:0 auto 30px;max-width:38ch;color:rgba(246,232,200,.85);
          font:16px/1.8 Georgia,'Times New Roman',serif}
  .heart{color:#ff8fb1}
  #abrir{appearance:none;cursor:pointer;
         padding:14px 38px;border-radius:999px;
         border:1px solid rgba(255,208,110,.55);
         background:linear-gradient(180deg,rgba(255,196,84,.15),rgba(255,160,50,.06));
         color:#ffdf9e;font:italic 600 16px/1 Georgia,'Times New Roman',serif;letter-spacing:.05em;
         transition:transform .18s ease, box-shadow .3s ease, background .3s ease}
  #abrir:hover{transform:translateY(-1px);box-shadow:0 8px 30px rgba(255,180,70,.24);
               background:linear-gradient(180deg,rgba(255,205,100,.26),rgba(255,170,60,.12))}
  #abrir:active{transform:translateY(1px) scale(.985)}
  #abrir:focus-visible{outline:2px solid rgba(255,214,130,.85);outline-offset:3px}

  #hint{position:fixed;left:0;right:0;bottom:18px;z-index:5;text-align:center;
        color:rgba(255,220,150,.55);font:italic 14px/1.6 Georgia,'Times New Roman',serif;
        letter-spacing:.14em;pointer-events:none;opacity:0;transition:opacity 1.8s ease}
  #hint.show{opacity:1}
  @media (prefers-reduced-motion:reduce){ .card{animation:none} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="letter">
  <div class="card">
    <div class="seal">♥</div>
    <div class="eyebrow">21 · septiembre</div>
    <h1>Feliz 21 de Septiembre</h1>
    <p>No te puedo ver hoy, pero esto es para ti <span class="heart">♥</span></p>
    <button id="abrir" type="button">Abrir tu regalo</button>
  </div>
</div>

<div id="hint">haz clic para esparcir un poco de amor ✧</div>

<script>
'use strict';
/* ═══════════ ✏️  PERSONALIZA AQUÍ  ═══════════
   Mensajes de la animación. La carta se edita arriba, en el HTML. */
const CONFIG = {
  titulo    : 'Para Chezy ♥',
  subtitulo : 'Feliz 21 de septiembre',
  firma     : 'con todo mi corazón'
};
/* ═════════════════════════════════════════════ */

const cv    = document.getElementById('c');
const ctx   = cv.getContext('2d');
const hint  = document.getElementById('hint');
const carta = document.getElementById('letter');
const btn   = document.getElementById('abrir');

/* ---------- utilidades ---------- */
const TAU = Math.PI * 2;
const GA  = Math.PI * (3 - Math.sqrt(5));            // ángulo dorado (espiral de semillas)
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const rnd   = (a,b)=> a+Math.random()*(b-a);
const easeOutCubic   = x => 1-Math.pow(1-x,3);
const easeInOutCubic = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
const easeOutBack    = x => { const c1=1.70158, c3=c1+1;
                              return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

let W=0, H=0, M=0, DPR=1;

/* ---------- sprites de brillo reutilizables ---------- */
function makeGlow(r,g,b){
  const s=128, c=document.createElement('canvas'); c.width=c.height=s;
  const x=c.getContext('2d');
  const gr=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,   `rgba(${r},${g},${b},1)`);
  gr.addColorStop(0.22,`rgba(${r},${g},${b},.42)`);
  gr.addColorStop(1,   `rgba(${r},${g},${b},0)`);
  x.fillStyle=gr; x.fillRect(0,0,s,s);
  return c;
}
const SPR = {
  GOLD   : makeGlow(255,198, 92),
  AMBER  : makeGlow(255,168, 64),
  WHITE  : makeGlow(205,220,255),
  WARM   : makeGlow(255,228,178),
  VIOLET : makeGlow(128,108,214),
  ROSE   : makeGlow(255,150,185)
};
function glowAt(x,y,s,a,spr){
  ctx.globalAlpha=a;
  ctx.drawImage(spr||SPR.GOLD, x-s/2, y-s/2, s, s);
}

/* ---------- formas ---------- */
function petalPath(g,r0,r1,w){         // pétalo apuntando hacia arriba
  const L=r1-r0;
  g.beginPath();
  g.moveTo(0,-r0);
  g.bezierCurveTo( w,-(r0+L*0.32),  w*0.82,-(r0+L*0.80), 0,-r1);
  g.bezierCurveTo(-w*0.82,-(r0+L*0.80), -w,-(r0+L*0.32), 0,-r0);
  g.closePath();
}
function leafPath(g,len){              // hoja horizontal puntiaguda
  g.beginPath();
  g.moveTo(0,0);
  g.bezierCurveTo(len*0.45,-len*0.32, len*0.95,-len*0.28, len,0);
  g.bezierCurveTo(len*0.95, len*0.28, len*0.45, len*0.32, 0,0);
  g.closePath();
}
function heartPath(g,s){
  g.beginPath();
  g.moveTo(0,-s*0.28);
  g.bezierCurveTo(-s*0.42,-s*0.62, -s*0.98,-s*0.18, 0, s*0.52);
  g.bezierCurveTo( s*0.98,-s*0.18,  s*0.42,-s*0.62, 0,-s*0.28);
  g.closePath();
}

/* ---------- paletas del campo ---------- */
const PALS = [
  { f0:'#ffe670', f1:'#ffb400', b0:'#d98f00', b1:'#7d4e06' },
  { f0:'#ffd94d', f1:'#ff9500', b0:'#c47a00', b1:'#6f4408' },
  { f0:'#fff3a0', f1:'#ffc23a', b0:'#d99400', b1:'#83540c' }
];

/* ---------- cabeza de girasol pequeño (para sprites del campo) ---------- */
function drawSmallHead(g,cx,cy,R,pal){
  g.save(); g.translate(cx,cy);
  const nB = R<9?8:10, nF = R<9?9:12;
  let r0=R*0.30, r1=R*0.86, w=R*(R<9?0.24:0.20);
  let grad=g.createLinearGradient(0,-r0,0,-r1);
  grad.addColorStop(0,pal.b0); grad.addColorStop(1,pal.b1);
  g.fillStyle=grad;
  for(let i=0;i<nB;i++){
    g.save(); g.rotate(i*TAU/nB); petalPath(g,r0,r1,w); g.fill(); g.restore();
  }
  r0=R*0.30; r1=R*1.05; w=R*(R<9?0.30:0.26);
  grad=g.createLinearGradient(0,-r0,0,-r1);
  grad.addColorStop(0,pal.f0); grad.addColorStop(1,pal.f1);
  g.fillStyle=grad;
  if(R>8){ g.strokeStyle='rgba(90,50,0,.35)'; g.lineWidth=Math.max(.6,R*0.035); }
  for(let i=0;i<nF;i++){
    g.save(); g.rotate(Math.PI/nF + i*TAU/nF);
    petalPath(g,r0,r1,w); g.fill();
    if(R>8) g.stroke();
    g.restore();
  }
  const cr=R*0.55;
  const cg=g.createRadialGradient(0,-cr*0.25,cr*0.1, 0,0,cr);
  cg.addColorStop(0,'#6b4526'); cg.addColorStop(0.55,'#4a2e17'); cg.addColorStop(1,'#2a170a');
  g.fillStyle=cg;
  g.beginPath(); g.arc(0,0,cr,0,TAU); g.fill();
  const K = R<7?26:64, c=cr/Math.sqrt(K), s=Math.max(0.55,c*0.62);
  const cols=['#5d3a1e','#3a2412','#8a5a2c'];
  for(let k=0;k<K;k++){
    const rr=c*Math.sqrt(k), th=k*GA;
    g.fillStyle = k%5===0 ? '#8a5a2c' : cols[k%3];
    g.beginPath(); g.arc(Math.cos(th)*rr, Math.sin(th)*rr, s,0,TAU); g.fill();
  }
  g.restore();
}

/* ---------- sprite completo de girasol pequeño del campo ---------- */
function makeSprite(R,palIdx){
  const pad=R*1.3, stemH=R*2.5;
  const w=Math.ceil(R*4.9), h=Math.ceil(pad+R*2.05+stemH+3);
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  const cx=w/2, headY=pad+R, baseY=h-1;
  const pal=PALS[palIdx];
  g.globalCompositeOperation='lighter'; g.globalAlpha=0.55;
  g.drawImage(SPR.GOLD, cx-R*2.05, headY-R*2.05, R*4.1, R*4.1);
  g.globalAlpha=1; g.globalCompositeOperation='source-over';
  const bend=rnd(-0.22,0.22)*R;
  g.strokeStyle='#2e6b20'; g.lineCap='round';
  g.lineWidth=Math.max(1.4,R*0.13);
  g.beginPath(); g.moveTo(cx,baseY);
  g.quadraticCurveTo(cx-bend, lerp(baseY,headY,0.55), cx+bend*0.5, headY+R*0.5);
  g.stroke();
  g.fillStyle='#2f6d21';
  g.save(); g.translate(cx, baseY-stemH*0.30); g.rotate(Math.PI*0.80);
  leafPath(g,R*1.25); g.fill(); g.restore();
  g.fillStyle='#2a611d';
  g.save(); g.translate(cx, baseY-stemH*0.52); g.rotate(Math.PI*0.22);
  leafPath(g,R*1.05); g.fill(); g.restore();
  drawSmallHead(g,cx,headY,R,pal);
  return {c,w,h};
}
const spriteCache={};
function getSprite(R,palIdx){
  const key=Math.round(R*2)/2 + '|' + palIdx;
  if(!spriteCache[key]) spriteCache[key]=makeSprite(parseFloat(key.split('|')[0]),palIdx);
  return spriteCache[key];
}

/* ---------- el campo de girasoles ---------- */
let field=[];
function buildField(){
  field.length=0;
  const vert = H > W*1.2;                     // pantalla vertical (celular)
  const yTop = vert ? H*0.60 : H*0.505;
  const yBot = vert ? H*0.965 : H*0.965;
  const rows=6;
  for(let i=0;i<rows;i++){
    const u=i/(rows-1);
    const y=lerp(yTop, yBot, vert ? u : Math.pow(u,1.6)) + rnd(-H*0.008,H*0.008);
    const baseR=lerp(M*0.008, M*(vert?0.052:0.034), vert ? Math.pow(u,1.1) : Math.pow(u,1.35));
    const count=Math.round(lerp(vert?18:24, 6, u));
    for(let j=0;j<count;j++){
      const x=((j+rnd(0,0.9))/count)*(W+M*0.06)-M*0.03;
      if(Math.abs(x-W/2) < M*(vert?0.30:0.26) && y>H*0.40) continue;   // claro central (para el ramo)
      const R=baseR*rnd(0.85,1.2);
      const headTop=y-R*3.4;
      const dx=W/2-x, dyUp=Math.max(40, headTop-H*0.42);
      const lean=clamp(Math.atan2(dx,dyUp)*0.35, -0.35, 0.35);
      field.push({
        x, y, R, lean,
        spr:getSprite(R, Math.floor(Math.random()*PALS.length)),
        wSpeed:rnd(0.5,1.1), wAmp:rnd(0.03,0.06),
        phase:rnd(0,TAU), delay:rnd(0,1.5),
        flip:Math.random()<0.5
      });
    }
  }
  field.sort((a,b)=>a.y-b.y);
}
function drawField(t,bloom){
  const orient=0.35+0.65*bloom;               // el campo se vuelve hacia el ramo
  for(const f of field){
    const ap=easeOutCubic(clamp((t-f.delay)/0.9,0,1));
    if(ap<=0) continue;
    const sway=Math.sin(t*f.wSpeed+f.phase)*f.wAmp*(REDUCED?0.3:1);
    ctx.save();
    ctx.translate(f.x,f.y);
    ctx.rotate(f.lean*orient + sway);
    if(f.flip) ctx.scale(-1,1);
    ctx.globalAlpha=ap*(0.86+0.14*Math.sin(t*0.9+f.phase*3));
    ctx.drawImage(f.spr.c, -f.spr.w/2, -f.spr.h+1);
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

/* ---------- corazones pre-renderizados (clave para que NO laguee) ----------
   El brillo se hornea una sola vez en el sprite; en el bucle solo se hace
   drawImage (rapidísimo) en lugar de shadowBlur por partícula.            */
function makeHeartSprite(col,rgbr){
  const s=96, c=document.createElement('canvas'); c.width=c.height=s;
  const g=c.getContext('2d');
  g.globalCompositeOperation='lighter';
  const gr=g.createRadialGradient(s/2,s/2,2, s/2,s/2,s/2);
  gr.addColorStop(0,`rgba(${rgbr},.5)`);
  gr.addColorStop(1,`rgba(${rgbr},0)`);
  g.fillStyle=gr; g.fillRect(0,0,s,s);
  g.globalCompositeOperation='source-over';
  g.translate(s/2,s/2);
  g.fillStyle=col; heartPath(g,s*0.34); g.fill();
  g.fillStyle='rgba(255,255,255,.32)';
  g.beginPath(); g.ellipse(-s*0.10,-s*0.10,s*0.055,s*0.032,-0.6,0,TAU); g.fill();
  return c;
}
const HEART_DEFS=[['#ff7fae','255,140,180'],['#ffb0c8','255,170,205'],['#ff6f9c','255,120,165'],
                  ['#ffd76a','255,205,120'],['#ff9d6b','255,175,130']];
const HEART_SPR=HEART_DEFS.map(d=>makeHeartSprite(d[0],d[1]));

/* ══════════ EL RAMO DE GIRASOLES (centro) ══════════ */
const HEADS_DEF=[                       // x,y = offsets en unidades de M ; r = radio relativo
  {x: 0.000, y:-0.150, r:0.150, ring:0},  // centro (el más grande)
  {x:-0.148, y:-0.058, r:0.112, ring:1},
  {x: 0.146, y:-0.050, r:0.118, ring:1},
  {x:-0.082, y:-0.240, r:0.092, ring:2},
  {x: 0.088, y:-0.246, r:0.088, ring:2},
  {x:-0.214, y:-0.148, r:0.072, ring:3},
  {x: 0.210, y:-0.156, r:0.076, ring:3}
];
const BQ={heads:[],wx:0,wy:0,coneW:0,coneH:0,babies:[]};

function makeSeedCols(R){
  const K=clamp(Math.round(420*Math.pow(R/(0.150*M),1.5)),60,420);
  const cols=['#5d3a1e','#4a2c14','#6d4522','#8a5a2c','#9c6c30','#d99a2d'];
  const out=[];
  for(let k=0;k<K;k++){
    const u=(Math.imul(k,2654435761)>>>0)%1000/1000;
    out.push(u<0.05?cols[5]:cols[Math.floor(u*5)]);
  }
  return out;
}

function layoutBouquet(){
  const vert=H>W*1.2;
  const cx=W/2, cy=vert?H*0.615:H*0.60;
  const xs=vert?0.72:1, ys=vert?1.10:1, rs=vert?0.94:1;
  BQ.wx=cx;                    BQ.wy=cy+M*(vert?0.030:0.020);
  BQ.coneW=M*(vert?0.185:0.205); BQ.coneH=M*(vert?0.300:0.260);
  BQ.heads=HEADS_DEF.map((d,i)=>{
    const R=d.r*M*rs, cr=R*0.60;
    const h={
      x:cx+d.x*M*xs, y:cy+d.y*M*ys, R, ring:d.ring,
      delay:d.ring*0.32+(i%2)*0.07,
      pal:PALS[(i+1)%PALS.length],
      seedCols:makeSeedCols(R), K:0,
      swayA:rnd(0.018,0.034), swayW:rnd(0.32,0.55), ph:rnd(0,TAU),
      spr:null, sprS:0,
      leafA:{at:0.44, rot:(d.x<0?Math.PI*0.80:Math.PI*0.20), len:R*1.20},
      leafB:null
    };
    if(Math.abs(d.x)<0.2) h.leafB={at:0.60, rot:Math.PI*0.24, len:R*1.00};
    h.K=h.seedCols.length;
    h.gradB=ctx.createLinearGradient(0,-R*0.34,0,-R*0.90);
    h.gradB.addColorStop(0,'#cf8e12'); h.gradB.addColorStop(1,'#7d4e06');
    h.gradF=ctx.createLinearGradient(0,-R*0.34,0,-R*1.05);
    h.gradF.addColorStop(0,'#ffe670'); h.gradF.addColorStop(1,'#ffb200');
    h.gradC=ctx.createRadialGradient(0,-cr*0.15,cr*0.05, 0,0,cr*1.02);
    h.gradC.addColorStop(0,'#7a4e26'); h.gradC.addColorStop(0.45,'#4e3014'); h.gradC.addColorStop(1,'#2a1808');
    return h;
  });
  /* respiración: racimos de puntitos blancos entre las flores */
  BQ.babies=[{x:cx-0.170*M*xs, y:cy-0.205*M*ys, n:11},
             {x:cx+0.168*M*xs, y:cy-0.212*M*ys, n:10},
             {x:cx+0.004*M,    y:cy-0.322*M*ys, n:10}]
    .map(b=>({x:b.x,y:b.y,dots:Array.from({length:b.n},()=>({
        dx:rnd(-M*0.030,M*0.030), dy:rnd(-M*0.026,M*0.026),
        r:rnd(0.8,1.7), ph:rnd(0,TAU)}))}));
  TB.burstAt=TB.stemStart+TB.stem*0.90+0.45+TB.petals+TB.seeds+3*0.32+0.30;
  TB.textAt=TB.burstAt+0.45;
}

/* ---------- línea de tiempo del ramo ---------- */
const TB={stem:1.5, wrap:0.8, petals:2.2, seeds:1.9, stemStart:0.30, burstAt:10, textAt:11};

/* ---------- una cabeza de girasol (crece progresivamente) ---------- */
function drawHead(g,h,petB,seed){
  const R=h.R, NB=16, NF=22;
  for(let i=0;i<NB;i++){
    const p=easeOutBack(clamp((petB-(i/NB)*0.55)/0.45,0,1));
    if(p<=0.002) continue;
    g.save(); g.rotate(i*TAU/NB+Math.PI/NB); g.scale(p,p);
    g.fillStyle=h.gradB; petalPath(g,R*0.34,R*0.90,R*0.30); g.fill(); g.restore();
  }
  g.lineWidth=Math.max(1,R*0.012);
  g.strokeStyle='rgba(120,60,0,.28)';
  for(let i=0;i<NF;i++){
    const p=easeOutBack(clamp((petB-(i/NF)*0.55)/0.45,0,1));
    if(p<=0.002) continue;
    g.save(); g.rotate(i*TAU/NF); g.scale(p,p);
    g.fillStyle=h.gradF; petalPath(g,R*0.34,R*1.05,R*0.24); g.fill(); g.stroke(); g.restore();
  }
  const cr=R*0.60;
  g.fillStyle=h.gradC; g.beginPath(); g.arc(0,0,cr,0,TAU); g.fill();
  g.strokeStyle='rgba(240,180,80,.45)'; g.lineWidth=Math.max(1,R*0.03);
  g.beginPath(); g.arc(0,0,cr*0.985,0,TAU); g.stroke();
  if(seed>0){
    const K=h.K, c=cr/Math.sqrt(K), upto=seed*K;
    for(let k=0;k<K;k++){
      const ap=seed>=1?1:clamp((upto-k)/7,0,1);
      if(ap<=0) break;
      const rr=c*Math.sqrt(k), th=k*GA;
      g.fillStyle=h.seedCols[k];
      g.beginPath(); g.arc(Math.cos(th)*rr, Math.sin(th)*rr, c*0.62*ap, 0, TAU); g.fill();
    }
    g.fillStyle='rgba(255,235,180,.05)';
    g.beginPath(); g.arc(-cr*0.3,-cr*0.32,cr*0.5,0,TAU); g.fill();
  }
}

/* hornea la cabeza terminada a un sprite (para no redibujar cientos de semillas) */
function renderHeadSprite(h){
  const R=h.R, q=Math.min(DPR,2), s=Math.ceil(R*2.75*q);
  const c=document.createElement('canvas'); c.width=c.height=s;
  const g=c.getContext('2d');
  g.translate(s/2,s/2); g.scale(q,q);
  const tmp=Object.create(h);
  const cr=R*0.60;
  tmp.gradB=g.createLinearGradient(0,-R*0.34,0,-R*0.90);
  tmp.gradB.addColorStop(0,'#cf8e12'); tmp.gradB.addColorStop(1,'#7d4e06');
  tmp.gradF=g.createLinearGradient(0,-R*0.34,0,-R*1.05);
  tmp.gradF.addColorStop(0,'#ffe670'); tmp.gradF.addColorStop(1,'#ffb200');
  tmp.gradC=g.createRadialGradient(0,-cr*0.15,cr*0.05, 0,0,cr*1.02);
  tmp.gradC.addColorStop(0,'#7a4e26'); tmp.gradC.addColorStop(0.45,'#4e3014'); tmp.gradC.addColorStop(1,'#2a1808');
  drawHead(g,tmp,1,1);
  h.spr=c; h.sprS=R*2.75;
}

function bigLeaf(p,rot,len,s){
  if(s<=0) return;
  ctx.save();
  ctx.translate(p.x,p.y); ctx.rotate(rot); ctx.scale(s,s);
  ctx.fillStyle='#3a8427';
  leafPath(ctx,len); ctx.fill();
  ctx.strokeStyle='rgba(20,45,12,.55)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(len*0.08,0); ctx.lineTo(len*0.86,0); ctx.stroke();
  ctx.restore();
}

function drawStem(h,stemP){
  if(stemP<=0) return;
  const bx=BQ.wx, by=BQ.wy, ex=h.x, ey=h.y+h.R*0.55;
  const cx=bx+(ex-bx)*0.20, cy=by-(by-ey)*0.52;
  const q=u=>{ const it=1-u;
    return { x:it*it*bx+2*it*u*cx+u*u*ex, y:it*it*by+2*it*u*cy+u*u*ey }; };
  const N=20, up=Math.max(2,Math.round(stemP*N));
  ctx.beginPath();
  for(let i=0;i<=up;i++){ const p=q(i/N); i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); }
  const sg=ctx.createLinearGradient(bx,by,ex,ey);
  sg.addColorStop(0,'#2d5f1c'); sg.addColorStop(1,'#4f9329');
  ctx.strokeStyle=sg; ctx.lineCap='round';
  ctx.lineWidth=lerp(2.4,h.R*0.10,stemP);
  ctx.stroke();
  const lp=easeOutBack(clamp((stemP-0.55)/0.45,0,1));
  if(lp>0){
    bigLeaf(q(h.leafA.at), h.leafA.rot, h.leafA.len, lp);
    if(h.leafB) bigLeaf(q(h.leafB.at), h.leafB.rot, h.leafB.len, lp*0.9);
  }
}

/* ---------- envoltura de papel + cinta + moño ---------- */
function drawWrap(p){
  const wx=BQ.wx, wy=BQ.wy, cw=BQ.coneW*0.5, ch=BQ.coneH;
  const yTop=wy-M*0.02, yBot=wy+ch, hgt=yBot-yTop;
  ctx.save();
  ctx.translate(wx,0);
  ctx.globalAlpha=Math.min(1,p*1.25);
  const grad=ctx.createLinearGradient(-cw,0,cw,0);
  grad.addColorStop(0,'#e8d3a8'); grad.addColorStop(0.42,'#f6e7c6');
  grad.addColorStop(0.72,'#d9bd8c'); grad.addColorStop(1,'#a98753');
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.moveTo(-cw, yTop);
  ctx.quadraticCurveTo(-cw*0.55, yTop+hgt*0.55, -cw*0.06, yBot);
  ctx.quadraticCurveTo(0, yBot+hgt*0.03, cw*0.06, yBot);
  ctx.quadraticCurveTo( cw*0.55, yTop+hgt*0.55,  cw, yTop);
  ctx.quadraticCurveTo(0, yTop-hgt*0.07, -cw, yTop);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(120,90,45,.35)'; ctx.lineWidth=1.2;
  ctx.beginPath();
  ctx.moveTo(-cw*0.42,yTop+hgt*0.05); ctx.quadraticCurveTo(-cw*0.26,yTop+hgt*0.5,-cw*0.03,yBot-hgt*0.03);
  ctx.moveTo( cw*0.42,yTop+hgt*0.05); ctx.quadraticCurveTo( cw*0.26,yTop+hgt*0.5, cw*0.03,yBot-hgt*0.03);
  ctx.moveTo(0,yTop-hgt*0.02);        ctx.quadraticCurveTo( cw*0.10,yTop+hgt*0.5, 0, yBot-hgt*0.02);
  ctx.stroke();
  ctx.strokeStyle='rgba(255,222,150,.5)'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(-cw,yTop); ctx.quadraticCurveTo(0,yTop-hgt*0.07,cw,yTop); ctx.stroke();
  /* cinta */
  const k=0.40, ry=yTop+hgt*k, hw=lerp(cw,cw*0.10,k)*1.04;
  const rg=ctx.createLinearGradient(-hw,0,hw,0);
  rg.addColorStop(0,'#8c2437'); rg.addColorStop(0.5,'#d4485f'); rg.addColorStop(1,'#7c1f2f');
  ctx.fillStyle=rg;
  ctx.beginPath();
  ctx.moveTo(-hw,ry-hgt*0.035); ctx.quadraticCurveTo(0,ry-hgt*0.05,hw,ry-hgt*0.035);
  ctx.lineTo(hw,ry+hgt*0.035);  ctx.quadraticCurveTo(0,ry+hgt*0.05,-hw,ry+hgt*0.035);
  ctx.closePath(); ctx.fill();
  /* moño */
  const bs=Math.max(0.35,easeOutBack(clamp((p-0.42)/0.58,0,1)));
  if(bs>0.02){
    ctx.save(); ctx.translate(0,ry); ctx.scale(bs,bs);
    const loopR=cw*0.66;
    ctx.fillStyle='#d4485f';
    ctx.save(); ctx.rotate(-0.40);
    ctx.beginPath(); ctx.ellipse(-loopR*0.60,-loopR*0.08,loopR*0.58,loopR*0.33,0,0,TAU); ctx.fill();
    ctx.restore();
    ctx.save(); ctx.rotate(0.40);
    ctx.beginPath(); ctx.ellipse(loopR*0.60,-loopR*0.08,loopR*0.58,loopR*0.33,0,0,TAU); ctx.fill();
    ctx.restore();
    ctx.strokeStyle='#b8384e'; ctx.lineWidth=Math.max(3,cw*0.10); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-cw*0.05,hgt*0.02); ctx.quadraticCurveTo(-cw*0.28,hgt*0.18,-cw*0.32,hgt*0.30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo( cw*0.05,hgt*0.02); ctx.quadraticCurveTo( cw*0.28,hgt*0.20, cw*0.31,hgt*0.32); ctx.stroke();
    const ng=ctx.createRadialGradient(-2,-2,1, 0,0,cw*0.20);
    ng.addColorStop(0,'#ff97a8'); ng.addColorStop(1,'#b8384e');
    ctx.fillStyle=ng;
    ctx.beginPath(); ctx.ellipse(0,0,cw*0.19,cw*0.155,0,0,TAU); ctx.fill();
    ctx.restore();
  }
  ctx.restore(); ctx.globalAlpha=1;
}

/* ---------- puntitos blancos (respiración del ramo) ---------- */
function drawBabies(p,t){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(const b of BQ.babies){
    for(const d of b.dots){
      const a=p*(0.40+0.60*(0.5+0.5*Math.sin(t*2.2+d.ph)));
      const sz=M*0.020;
      ctx.globalAlpha=a*0.8;
      ctx.drawImage(SPR.WHITE, b.x+d.dx-sz/2, b.y+d.dy-sz/2, sz, sz);
      ctx.globalAlpha=Math.min(1,a);
      ctx.fillStyle='rgba(255,252,240,.92)';
      ctx.beginPath(); ctx.arc(b.x+d.dx,b.y+d.dy,d.r,0,TAU); ctx.fill();
    }
  }
  ctx.restore(); ctx.globalAlpha=1;
}

function drawBouquetHead(h,bud,petB,seed,t){
  const R=h.R;
  const sway=Math.sin(t*h.swayW+h.ph)*h.swayA*(REDUCED?0.3:1);
  const pulse=0.85+0.15*Math.sin(t*1.8+h.ph*1.3);
  const gA=(0.05+0.15*Math.max(petB,seed*0.6))*pulse*bud;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  glowAt(h.x,h.y,R*4.4,gA*0.9,SPR.AMBER);
  glowAt(h.x,h.y,R*2.3,gA,SPR.GOLD);
  ctx.restore(); ctx.globalAlpha=1;

  ctx.save();
  const ay=h.y+R*0.55;
  ctx.translate(h.x,ay); ctx.rotate(sway); ctx.translate(0,-R*0.55);
  if(!h.spr && petB>=1 && seed>=1) renderHeadSprite(h);
  if(h.spr){
    const s=h.sprS;
    ctx.drawImage(h.spr,-s/2,-s/2,s,s);
  }else{
    ctx.save(); ctx.scale(bud,bud); drawHead(ctx,h,petB,seed); ctx.restore();
  }
  ctx.restore();
}

let burstDone=false, lastHeart=0;
function drawBouquet(t){
  const bx=BQ.wx, by=BQ.wy;
  if(t<=TB.stemStart) return;
  const bloom=easeInOutCubic(clamp((t-TB.stemStart)/(TB.burstAt-TB.stemStart),0,1));
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const pulse=0.86+0.14*Math.sin(t*1.7);
  glowAt(bx, by-M*0.16, M*1.9, (0.04+bloom*0.075)*pulse, SPR.AMBER);
  ctx.restore(); ctx.globalAlpha=1;

  for(const h of BQ.heads)
    drawStem(h, easeInOutCubic(clamp((t-(TB.stemStart+h.ring*0.10))/TB.stem,0,1)));

  const wrapP=easeOutCubic(clamp((t-TB.wrapStart)/TB.wrap,0,1));
  if(wrapP>0) drawWrap(wrapP);

  const order=BQ.heads.map((h,i)=>i).sort((a,b)=>BQ.heads[a].R-BQ.heads[b].R);
  for(const idx of order){
    const h=BQ.heads[idx];
    const t0=TB.stemStart+TB.stem*0.90+h.delay;
    const bud=easeOutBack(clamp((t-t0)/0.45,0,1));
    if(bud<=0) continue;
    const petB=clamp((t-(t0+0.45))/TB.petals,0,1);
    const seed=clamp((t-(t0+0.45+TB.petals))/TB.seeds,0,1);
    drawBouquetHead(h,bud,petB,seed,t);
  }

  const babP=easeOutCubic(clamp((t-(TB.burstAt-1.1))/1.0,0,1));
  if(babP>0) drawBabies(babP,t);

  const bp=t-TB.burstAt;
  if(bp>=0){
    if(!burstDone){ burstDone=true; spawnBurst(bx,by-M*0.17); lastHeart=t; }
    drawBurstRings(bx,by-M*0.17,bp);
  }
  if(bp>0.8 && !REDUCED && t-lastHeart>2.6){
    lastHeart=t;
    const h=BQ.heads[Math.floor(Math.random()*BQ.heads.length)];
    addPart(heartParticle(h.x+rnd(-h.R*0.5,h.R*0.5), h.y-h.R*0.7, 0.55+rnd(0,0.4), true));
  }
}

/* ---------- fondo ---------- */
function drawBG(t,bloom){
  ctx.fillStyle='#030308';
  ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.globalCompositeOperation='lighter';
  glowAt(W*0.18,H*0.16,M*0.95,0.05,SPR.VIOLET);
  glowAt(W*0.84,H*0.10,M*0.75,0.045,SPR.VIOLET);
  glowAt(W/2,H*0.40,M*1.25,0.05+bloom*0.085,SPR.AMBER);
  ctx.restore(); ctx.globalAlpha=1;
  const g=ctx.createLinearGradient(0,H*0.47,0,H);
  g.addColorStop(0,'rgba(16,24,8,0)');
  g.addColorStop(1,'rgba(16,24,8,0.5)');
  ctx.fillStyle=g; ctx.fillRect(0,H*0.47,W,H*0.53);
}

/* ---------- estrellas ---------- */
let stars=[];
function buildStars(){
  stars=[];
  const n=REDUCED?90:150;
  for(let i=0;i<n;i++){
    stars.push({ x:rnd(0,W), y:rnd(0,H*0.62), r:rnd(0.5,1.6),
                 sp:rnd(0.4,1.6), ph:rnd(0,TAU), warm:Math.random()<0.35 });
  }
}
function drawStars(t){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(const s of stars){
    const tw=0.30+0.70*(0.5+0.5*Math.sin(t*s.sp+s.ph));
    ctx.globalAlpha=tw*0.75;
    const sz=s.r*10;
    ctx.drawImage(s.warm?SPR.WARM:SPR.WHITE, s.x-sz/2, s.y-sz/2, sz, sz);
  }
  ctx.restore(); ctx.globalAlpha=1;
}

/* ---------- estrella fugaz ---------- */
let shoot=null, nextShoot=rnd(6,11);
function drawShoot(t,dt){
  if(REDUCED) return;
  if(!shoot){
    nextShoot-=dt;
    if(nextShoot<=0)
      shoot={x:rnd(W*0.08,W*0.72), y:rnd(H*0.04,H*0.22),
             dx:rnd(W*0.14,W*0.30), dy:rnd(H*0.05,H*0.11), p:0};
    return;
  }
  shoot.p+=dt/0.85;
  if(shoot.p>=1){ shoot=null; nextShoot=rnd(8,16); return; }
  const e=shoot.p, px=shoot.x+shoot.dx*e, py=shoot.y+shoot.dy*e;
  const tx=shoot.x+shoot.dx*Math.max(0,e-0.16), ty=shoot.y+shoot.dy*Math.max(0,e-0.16);
  ctx.save(); ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=Math.sin(e*Math.PI);
  const gr=ctx.createLinearGradient(tx,ty,px,py);
  gr.addColorStop(0,'rgba(255,255,255,0)');
  gr.addColorStop(1,'rgba(255,250,230,.95)');
  ctx.strokeStyle=gr; ctx.lineWidth=1.8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(px,py); ctx.stroke();
  glowAt(px,py,26,0.9,SPR.WHITE);
  ctx.restore(); ctx.globalAlpha=1;
}

/* ---------- luciérnagas ---------- */
let fireflies=[];
function buildFireflies(){
  fireflies=[];
  const n=REDUCED?8:14;
  for(let i=0;i<n;i++){
    fireflies.push({ x:rnd(0,W), y:rnd(H*0.30,H*0.85),
                     a1:rnd(0.3,1.2), a2:rnd(0.3,1.2),
                     p1:rnd(0,TAU), p2:rnd(0,TAU),
                     sp:rnd(0.8,2.0), ph:rnd(0,TAU) });
  }
}
function drawFireflies(t,dt){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(const f of fireflies){
    f.x+=Math.cos(t*f.a1+f.p1)*26*dt;
    f.y+=Math.sin(t*f.a2+f.p2)*20*dt;
    if(f.x<-30) f.x=W+20;  if(f.x>W+30) f.x=-20;
    if(f.y<H*0.25) f.y=H*0.25;  if(f.y>H*0.9) f.y=H*0.9;
    const pu=0.5+0.5*Math.sin(t*f.sp+f.ph), a=pu*pu;
    ctx.globalAlpha=a*0.75;
    const sz=M*(0.014+0.022*pu);
    ctx.drawImage(SPR.GOLD, f.x-sz/2, f.y-sz/2, sz, sz);
    ctx.globalAlpha=a;
    ctx.fillStyle='rgba(255,244,200,1)';
    ctx.beginPath(); ctx.arc(f.x,f.y,1.5,0,TAU); ctx.fill();
  }
  ctx.restore(); ctx.globalAlpha=1;
}

/* ---------- polen flotante ---------- */
let pollen=[];
function buildPollen(){
  pollen=[];
  const n=REDUCED?18:40;
  for(let i=0;i<n;i++){
    pollen.push({ x:rnd(0,W), y:rnd(0,H*0.95), r:rnd(0.7,1.8),
                  ph:rnd(0,TAU), vy:rnd(-14,-4), sp:rnd(0.6,1.6) });
  }
}
function drawPollen(t,dt){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(const p of pollen){
    p.y+=p.vy*dt; p.x+=Math.sin(t*p.sp+p.ph)*14*dt;
    if(p.y<-8){ p.y=H+8; p.x=rnd(0,W); }
    ctx.globalAlpha=0.16+0.30*(0.5+0.5*Math.sin(t*2.1+p.ph*2));
    const sz=p.r*9;
    ctx.drawImage(SPR.GOLD, p.x-sz/2, p.y-sz/2, sz, sz);
  }
  ctx.restore(); ctx.globalAlpha=1;
}

/* ---------- partículas: corazones, chispas, ondas ---------- */
const parts=[];
const MAX_PARTS=240;
function addPart(p){
  if(parts.length>=MAX_PARTS) parts.splice(0, parts.length-MAX_PARTS+1);
  parts.push(p);
}
function heartParticle(x,y,k,rising){
  const spr=Math.floor(Math.random()*HEART_SPR.length);
  return { type:'heart', spr, x, y,
    vx:rising?rnd(-10,10):Math.cos(rnd(-Math.PI*0.85,-Math.PI*0.15))*rnd(50,190),
    vy:rising?rnd(-70,-40):Math.sin(rnd(-Math.PI*0.85,-Math.PI*0.15))*rnd(50,190),
    age:0, life:rising?rnd(2.6,3.8):rnd(1.3,2.1),
    s:rnd(8,16)*Math.max(0.6,M/1000), rot:rnd(-0.5,0.5), vr:rnd(-1.2,1.2),
    ph:rnd(0,TAU), k:k||1 };
}
function spawnHearts(x,y){
  const n=REDUCED?6:10+Math.floor(Math.random()*7);
  for(let i=0;i<n;i++) addPart(heartParticle(x,y,1,false));
  const ns=REDUCED?4:8;
  for(let i=0;i<ns;i++){
    const a=rnd(0,TAU), sp=rnd(30,110);
    addPart({ type:'spark', x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-40,
              age:0, life:rnd(0.5,0.9), sz:rnd(8,16) });
  }
  addPart({ type:'ring', x, y, age:0, life:0.7 });
}
function spawnBurst(x,y){
  for(let i=0;i<30;i++){
    const a=rnd(0,TAU), sp=rnd(60,220);
    addPart({ type:'spark', x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
              age:0, life:rnd(0.7,1.4), sz:rnd(14,30) });
  }
  for(let i=0;i<12;i++){
    const a=rnd(-Math.PI*0.95,-Math.PI*0.05), sp=rnd(40,150);
    addPart({ type:'heart', spr:Math.floor(Math.random()*HEART_SPR.length),
      x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, age:0, life:rnd(1.6,2.6),
      s:rnd(10,18)*Math.max(0.6,M/1000), rot:rnd(-0.6,0.6), vr:rnd(-1.4,1.4), ph:rnd(0,TAU), k:1 });
  }
}
function drawBurstRings(x,y,bp){
  if(bp>=1.6) return;
  const e=easeOutCubic(clamp(bp/1.1,0,1)), a1=clamp(1-bp/1.1,0,1);
  const R=M*0.15;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle=`rgba(255,224,150,${a1*0.8})`;
  ctx.lineWidth=lerp(10,1,e);
  ctx.beginPath(); ctx.arc(x,y,R*0.5+e*R*4.0,0,TAU); ctx.stroke();
  const e2=easeOutCubic(clamp((bp-0.15)/1.3,0,1)), a2=clamp(1-(bp-0.15)/1.3,0,1);
  if(a2>0){
    ctx.strokeStyle=`rgba(255,200,110,${a2*0.5})`;
    ctx.lineWidth=lerp(6,1,e2);
    ctx.beginPath(); ctx.arc(x,y,R*0.4+e2*R*2.8,0,TAU); ctx.stroke();
  }
  if(bp<0.4){
    ctx.globalAlpha=(1-bp/0.4)*0.30;
    ctx.drawImage(SPR.AMBER,x-R*4,y-R*4,R*8,R*8);
  }
  ctx.restore(); ctx.globalAlpha=1;
}
function drawParts(dt){
  if(!parts.length) return;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.age+=dt;
    if(p.age>=p.life){ parts[i]=parts[parts.length-1]; parts.pop(); continue; }
    const u=p.age/p.life, fade=1-u;
    if(p.type==='spark'){
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      const dmp=Math.max(0,1-1.4*dt);
      p.vx*=dmp; p.vy*=dmp;
      glowAt(p.x,p.y,p.sz*(0.5+0.5*fade),fade*0.55,SPR.GOLD);
    }else if(p.type==='ring'){
      const e=easeOutCubic(u);
      ctx.globalAlpha=(1-u)*0.5;
      ctx.strokeStyle='rgba(255,214,130,1)';
      ctx.lineWidth=2.5*(1-u)+0.5;
      ctx.beginPath(); ctx.arc(p.x,p.y,8+e*70,0,TAU); ctx.stroke();
      ctx.globalAlpha=1;
    }else{
      p.vy+=(p.life>2?10:26)*dt;
      p.vx*=Math.max(0,1-1.2*dt);
      p.x+=p.vx*dt+Math.sin(p.age*5+p.ph)*16*dt;
      p.y+=p.vy*dt;
      p.rot+=p.vr*dt;
      const d=p.s*1.4*(1+u*0.15);
      ctx.save();
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.globalAlpha=Math.min(1,fade*1.4);
      ctx.drawImage(HEART_SPR[p.spr],-d,-d,d*2,d*2);
      ctx.restore();
    }
  }
  ctx.restore(); ctx.globalAlpha=1;
}

/* ---------- mensaje final (sprite con brillo horneado) ---------- */
let textSpr=null;
function bakeText(){
  const vert=H>W*1.2;
  const px=clamp(vert?W*0.145:M*0.070,24,64);
  const probe=document.createElement('canvas').getContext('2d');
  probe.font='italic 600 '+px+'px Georgia, "Times New Roman", serif';
  const w1=probe.measureText(CONFIG.titulo).width;
  probe.font='italic '+(px*0.42)+'px Georgia, "Times New Roman", serif';
  const w2=probe.measureText(CONFIG.subtitulo).width;
  probe.font='italic '+(px*0.34)+'px Georgia, "Times New Roman", serif';
  const w3=probe.measureText(CONFIG.firma).width;
  const w=Math.ceil(Math.max(w1,w2,w3)+90), h=Math.ceil(px*2.7);
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  g.textAlign='center'; g.textBaseline='middle';
  if('letterSpacing' in g) g.letterSpacing='2px';
  g.shadowColor='rgba(255,200,80,.95)'; g.shadowBlur=24;
  g.font='italic 600 '+px+'px Georgia, "Times New Roman", serif';
  g.fillStyle='rgba(255,226,140,1)';
  g.fillText(CONFIG.titulo, w/2, px*0.78);
  g.shadowBlur=9;
  g.font='italic '+(px*0.42)+'px Georgia, "Times New Roman", serif';
  g.fillStyle='rgba(250,234,196,.95)';
  g.fillText(CONFIG.subtitulo, w/2, px*0.78+px*0.92);
  g.font='italic '+(px*0.34)+'px Georgia, "Times New Roman", serif';
  g.fillStyle='rgba(255,214,150,.78)';
  g.fillText(CONFIG.firma, w/2, px*0.78+px*1.66);
  textSpr=c;
}
function drawText(t,at){
  if(!textSpr) return;
  const a=easeOutCubic(clamp((t-TB.textAt)/1.6,0,1));
  if(a<=0) return;
  const vert=H>W*1.2;
  const y=(vert?H*0.105:H*0.135)+Math.sin(at*0.8)*5;
  ctx.save();
  ctx.globalAlpha=a;
  ctx.drawImage(textSpr, W/2-textSpr.width/2, y-textSpr.height/2);
  ctx.restore(); ctx.globalAlpha=1;
}

/* ---------- interacción ---------- */
let hintShown=false, lastMove=0;
function hideHint(){ hint.classList.remove('show'); }
function openExperience(){
  if(phase!=='letter') return;
  phase='field';
  carta.classList.add('hidden');
  setTimeout(()=>{ if(carta.parentNode) carta.parentNode.removeChild(carta); }, 1300);
  if(REDUCED) animT=TB.textAt+2.0;
  setTimeout(()=>{ if(phase==='field') hint.classList.add('show'); }, REDUCED?900:9000);
  setTimeout(()=>hideHint(), REDUCED?20000:26000);
}
btn.addEventListener('click',openExperience);
carta.addEventListener('click',e=>{ if(e.target===carta) openExperience(); });
document.addEventListener('keydown',e=>{
  if(phase==='letter' && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); openExperience(); }
});
cv.addEventListener('pointerdown',e=>{ hideHint(); spawnHearts(e.clientX,e.clientY); });
cv.addEventListener('pointermove',e=>{
  const now=performance.now();
  if(now-lastMove<55) return;
  lastMove=now;
  if(parts.length>150) return;
  addPart({ type:'spark', x:e.clientX, y:e.clientY, vx:rnd(-8,8), vy:rnd(-30,-12),
            age:0, life:rnd(0.5,1), sz:rnd(6,12) });
});
cv.addEventListener('dblclick',()=>{
  try{
    if(!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }catch(err){}
});

/* ---------- estado ---------- */
let phase='letter', animT=0;

/* ---------- tamaño / reconstrucción ---------- */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight; M=Math.min(W,H);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  for(const k in spriteCache) delete spriteCache[k];
  layoutBouquet(); buildField(); buildStars(); buildFireflies(); buildPollen(); bakeText();
}
window.addEventListener('resize',resize);
resize();

/* ---------- pausa cuando la pestaña no está visible ---------- */
let raf=null, tStart=null, lastT=null;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ if(raf){ cancelAnimationFrame(raf); raf=null; } }
  else if(!raf){ lastT=null; raf=requestAnimationFrame(frame); }
});

/* ---------- bucle principal ---------- */
function frame(ms){
  if(tStart===null){ tStart=ms/1000; lastT=tStart; }
  const now=ms/1000;
  if(lastT===null) lastT=now;
  let dt=now-lastT; lastT=now;
  if(dt>0.05) dt=0.05; if(dt<0) dt=0;
  const at=now-tStart;                    // reloj ambiental (siempre corre)
  if(phase==='field') animT+=dt;          // reloj del ramo (arranca al abrir la carta)
  const bloom=easeInOutCubic(clamp((animT-TB.stemStart)/(TB.burstAt-TB.stemStart),0,1));
  drawBG(at,bloom);
  drawStars(at);
  drawShoot(at,dt);
  drawField(animT,bloom);
  drawFireflies(at,dt);
  drawBouquet(animT);
  drawPollen(at,dt);
  drawParts(dt);
  drawText(animT,at);
  raf=requestAnimationFrame(frame);
}
raf=requestAnimationFrame(frame);
</script>
